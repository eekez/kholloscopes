<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon planning de khôlles — Professeurs — Le Chesnoy</title>

<link rel="manifest" href="manifest-prof.json">

<link rel="apple-touch-icon" href="icons/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Khôlles Profs">

<!-- ============================================================================
     CONFIGURATION — à modifier une fois le classeur publié sur le web
     (Fichier > Partager > Publier sur le web > sélectionner les 4 onglets élèves)
     ============================================================================ -->
<script>
  const SHEET_ID = "1jxBFq5x4I5X9-W7dQ_y7QSduLn1nvqz15pPeeyQqyg8";
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="khollescope-style.css?v=1">
</head>
<body>

<a href="#contenu" class="skip-link">Aller au contenu principal</a>

<header>
  <h1>Mon planning de khôlles</h1>
  <p>Professeurs — Lycée Le Chesnoy — Année 2026-2027</p>
</header>

<main id="contenu">
  <section class="panel" aria-label="Rechercher mon planning">
    <div class="champ">
      <label for="input-nom-prof">Votre nom</label>
      <input type="text" id="input-nom-prof" placeholder="Ex : Martin">
    </div>
    <button type="button" class="btn-rechercher" id="btn-rechercher">Afficher mon planning</button>
  </section>

  <section id="zone-resultats" aria-live="polite"></section>
</main>

<footer>
  Les données proviennent du colloscope tenu par l'établissement — en cas d'écart constaté, merci de le signaler pour correction.
</footer>

<script src="khollescope-commun.js?v=4"></script>
<script>
(function () {
  "use strict";

  const inputNomProf = document.getElementById('input-nom-prof');
  const btnRechercher = document.getElementById('btn-rechercher');
  const zoneResultats = document.getElementById('zone-resultats');

  const CLE_STOCKAGE_NOM = 'khollescope_nom_prof';

  // Les khôlles ne sont affichées qu'à partir de cette date (semaine de la
  // rentrée) : toute khôlle antérieure (test, khôlle blanche, etc.) reste
  // masquée sur cette page. À ajuster chaque année.
  const DATE_DEBUT_AFFICHAGE = new Date(2026, 8, 1); // 7 septembre 2026

  async function rechercher() {
    const nom = inputNomProf.value.trim();
    if (!nom) {
      afficherErreur(zoneResultats, 'Merci de saisir un nom.');
      return;
    }
    localStorage.setItem(CLE_STOCKAGE_NOM, nom);
    afficherChargement(zoneResultats);
    try {
      const exportWeb = await chargerExportWeb();
      const toutes = [];
      const nomsGroupesParClasse = {};
      for (const classe of Object.keys(ONGLETS)) {
        const rows = await chargerOnglet(ONGLETS[classe]);
        nomsGroupesParClasse[classe] = extraireNomsGroupes(rows);
        const items = extraireCreneaux(rows, classe, {
          nomRecherche: nom,
          pivotMathsTB1: exportWeb.pivot,
          exportWeb: exportWeb,
        });
        toutes.push(...items);
      }
	 const toutesFiltrees = toutes.filter(item => {
		  const d = new Date(item.date.getTime());
		  d.setHours(0, 0, 0, 0);
		  const dSemaine = item.dateSemaine ? new Date(item.dateSemaine.getTime()) : d;
		  dSemaine.setHours(0, 0, 0, 0);
		  return d >= DATE_DEBUT_AFFICHAGE || dSemaine >= DATE_DEBUT_AFFICHAGE;
		});
      afficherResultats(zoneResultats, toutesFiltrees, 'Planning de ' + nom,
        { afficherClasseGroupe: true, afficherNomProf: false, nomsGroupesParClasse });
      afficherHeuresParLot(nom, exportWeb);
      afficherDebugNomsSiActive(nomsGroupesParClasse);
    } catch (e) {
      afficherErreur(zoneResultats, 'Impossible de charger le planning pour le moment. Vérifiez votre connexion, ou réessayez plus tard.');
      console.error(e);
    }
  }

  function afficherHeuresParLot(nom, exportWeb) {
    // Recherche insensible à la casse/accents approximative : on cherche une clé
    // de heuresParNom qui correspond au nom saisi (même logique que la recherche
    // de créneaux, en limite de mot).
    const motif = new RegExp('(?:^|\\b)' + nom.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:\\b|$)', 'i');
    const cleTrouvee = Object.keys(exportWeb.heuresParNom).find(cle => motif.test(cle));
    if (!cleTrouvee) return;
    const heures = exportWeb.heuresParNom[cleTrouvee];
    const bloc = document.createElement('div');
    bloc.className = 'panel';
    bloc.style.marginTop = '1.5rem';
    bloc.innerHTML = '<div class="resultats-entete"><h2>Heures déclarées</h2></div>' +
      '<p style="margin:0;color:var(--gris);">' + formatHeuresParLot(heures) + '</p>';
    zoneResultats.appendChild(bloc);
  }

  // Mode debug : ajouter ?debug=1 à la fin de l'URL pour afficher, sous les
  // résultats, le contenu détecté comme "ligne des noms" pour chaque classe.
  function afficherDebugNomsSiActive(nomsGroupesParClasse) {
    if (new URLSearchParams(window.location.search).get('debug') !== '1') return;
    let html = '<div style="margin-top:2rem;padding:1rem;background:#fff;border:2px dashed #C99A3D;border-radius:8px;font-family:monospace;font-size:0.75rem;white-space:pre-wrap;word-break:break-word;">';
    html += '<strong>MODE DEBUG — noms détectés par classe (ligne d\'index 1 de l\'onglet)</strong>\n\n';
    for (const classe of Object.keys(nomsGroupesParClasse)) {
      html += classe + ' : ' + JSON.stringify(nomsGroupesParClasse[classe], null, 2) + '\n\n';
    }
    html += '</div>';
    zoneResultats.innerHTML += html;
  }

  btnRechercher.addEventListener('click', rechercher);
  inputNomProf.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') rechercher();
  });

  // Présélection + lancement automatique si un nom est déjà mémorisé sur cet
  // appareil (l'utilisateur n'a plus besoin de le ressaisir à chaque ouverture).
  const nomMemorise = localStorage.getItem(CLE_STOCKAGE_NOM);
  if (nomMemorise) {
    inputNomProf.value = nomMemorise;
    rechercher();
  }

  initBandeauInstallation('Khôlles Profs');

  if (SHEET_ID.startsWith('REMPLACER')) {
    afficherErreur(zoneResultats, 'Configuration manquante : l\'identifiant du Google Sheet n\'a pas encore été renseigné dans le code (variable SHEET_ID en haut du fichier).');
  }
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {
      // Échec silencieux : l'app reste utilisable normalement dans le navigateur,
      // seule l'installation sur l'écran d'accueil pourrait ne pas être proposée.
    });
  }
</script>

</body>
</html>
